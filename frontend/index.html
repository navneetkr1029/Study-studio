<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Studio</title>
  <meta name="description" content="Turn notes, PDFs and images into summaries, Q&A sets and flashcards.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">S</span>
      <div>
        <h1>Study Studio</h1>
        <p>Turn anything you're studying into summaries, Q&amp;A and flashcards</p>
      </div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Checking server…</span></div>
  </header>

  <main class="layout">
    <!-- ───────── Left: study material ───────── -->
    <section class="card" aria-labelledby="material-h">
      <h2 id="material-h"><span class="step">1</span> Your study material</h2>

      <label id="dropzone" class="dropzone" for="file-input">
        <input id="file-input" type="file" multiple
               accept=".pdf,.txt,.md,.markdown,.csv,.png,.jpg,.jpeg,.webp,.gif,application/pdf,text/plain,text/csv,image/*">
        <strong>Drop files here or click to browse</strong>
        <span>PDF · TXT · MD · CSV · images (PNG, JPG, WEBP)</span>
      </label>
      <ul id="file-list" class="file-list" aria-live="polite"></ul>

      <div class="field-head">
        <label for="notes">Or type / paste your own notes</label>
        <button id="clear-notes" class="link" type="button">Clear</button>
      </div>
      <textarea id="notes" spellcheck="true"
                placeholder="Type or paste anything here: lecture notes, a textbook chapter, a whole book. There is no length limit. Text from uploaded files is added here too, so you can edit it before generating."></textarea>
      <div id="counter" class="counter">0 words · 0 characters</div>
    </section>

    <!-- ───────── Right: options + output ───────── -->
    <div class="right">
      <section class="card" aria-labelledby="gen-h">
        <h2 id="gen-h"><span class="step">2</span> What should I make?</h2>

        <div class="modes" role="tablist" aria-label="Output type">
          <button class="mode active" role="tab" aria-selected="true"  data-mode="summary">Summary</button>
          <button class="mode"        role="tab" aria-selected="false" data-mode="qa">Q&amp;A</button>
          <button class="mode"        role="tab" aria-selected="false" data-mode="flashcards">Flashcards</button>
          <button class="mode"        role="tab" aria-selected="false" data-mode="custom">Custom</button>
        </div>

        <div id="custom-wrap" class="custom-wrap" hidden>
          <label for="custom-prompt">Tell me exactly what you want</label>
          <textarea id="custom-prompt" rows="3"
                    placeholder="e.g. Make a 10-question quiz with answers · Explain this like I'm 12 · Create a study schedule for 3 days"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="level">Explain it for</label>
            <select id="level">
              <option>middle school</option>
              <option selected>high school</option>
              <option>college</option>
              <option>complete beginner</option>
              <option>expert</option>
            </select>
          </div>
          <div class="field" id="count-field">
            <label for="count">How many? <span class="hint">(optional)</span></label>
            <input id="count" type="number" min="1" max="100" placeholder="auto">
          </div>
        </div>

        <button id="generate" class="primary" type="button">Generate</button>
      </section>

      <section id="result-card" class="card result" aria-labelledby="result-h" hidden>
        <div class="result-head">
          <h2 id="result-h"><span class="step">3</span> <span id="result-title">Result</span></h2>
          <div class="actions">
            <button id="copy" class="ghost" type="button">Copy</button>
            <button id="download" class="ghost" type="button">Download .md</button>
          </div>
        </div>
        <div id="progress" class="progress" hidden>
          <div class="bar"><span id="bar-fill"></span></div>
          <p id="progress-text"></p>
        </div>
        <div id="error" class="error" role="alert" hidden></div>
        <div id="output" class="output"></div>
      </section>
    </div>
  </main>

  <footer class="foot">Answers are generated by an AI model from your material. Double-check anything important.</footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
